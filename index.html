<!DOCTYPE html>
<html lang="pt-BR">
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
     <input type="file" id="arquivoExcel" accept=".xlsx">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="pagina">
        <header class="cabecalho">
            <p class="subtitulo">FICHA DE PERSONAGEM</p>
            <h1><span id="valor-nome">—</span></h1>
        </header>

       <div class="conteudo-principal">
            <!-- COLUNA DA ESQUERDA: Atributos e Perícias -->
            <div class="coluna-esquerda"><p class="descricao">Atributos</p>
                <section>
                    <div class="atributos" aria-label="Atributos do personagem">
                        <article class="atributo">
                            <h2>Força</h2>
                            <p class="valor"><span id="valor-forca">—</span></p>
                            <p class="modificador"><span id="mod-forca">—</span></p>
                        </article>

                        <article class="atributo">
                            <h2>Destreza</h2>
                            <p class="valor"><span id="valor-destreza">—</span></p>
                            <p class="modificador"><span id="mod-destreza">—</span></p>
                        </article>

                        <article class="atributo">
                            <h2>Constituição</h2>
                            <p class="valor"><span id="valor-constituicao">—</span></p>
                            <p class="modificador"><span id="mod-constituicao">—</span></p>
                        </article>

                        <article class="atributo">
                            <h2>Inteligência</h2>
                            <p class="valor"><span id="valor-inteligencia">—</span></p>
                            <p class="modificador"><span id="mod-inteligencia">—</span></p>
                        </article>

                        <article class="atributo">
                            <h2>Sabedoria</h2>
                            <p class="valor"><span id="valor-sabedoria">—</span></p>
                            <p class="modificador"><span id="mod-sabedoria">—</span></p>
                        </article>

                        <article class="atributo">
                            <h2>Carisma</h2>
                            <p class="valor"><span id="valor-carisma">—</span></p>
                            <p class="modificador"><span id="mod-carisma">—</span></p>
                        </article>
                    </div>
                </section>

                <section>
                    <p class="descricao">Perícias</p>
                    <div id="container-pericias" class="pericias" aria-label="Perícias do personagem">
                        <!-- Gerado dinamicamente pelo read.js em 4 colunas compactas -->
                    </div>
                </section>
            </div>


            <!-- COLUNA DA DIREITA: Foto, Vida e Energia -->
            <aside class="painel-lateral">
                <div class="coluna-esquerda"><p class="descricao">Atributos</p>
                <div class="status-grupo">
                    <div class="status-grupo">
                            <!-- BARRA DE VIDA -->
                            <div class="barra-status-container" id="container-vida">
                                <div class="barra-cabecalho">
                                    <span class="barra-titulo">Vida</span>
                                    <span class="barra-valores"><span id="valor-vida-atual">0</span> / <span id="valor-vida-max">0</span></span>
                                </div>
                                <div class="barra-controles">
                                    <div class="botoes-esquerda">
                                        <button class="btn-status" onclick="alterarStatus('vida', -5)">&laquo; -5</button>
                                        <button class="btn-status" onclick="alterarStatus('vida', -1)">&lt; -1</button>
                                    </div>
                                    <div class="botoes-direita">
                                        <button class="btn-status" onclick="alterarStatus('vida', 1)">+1 &gt;</button>
                                        <button class="btn-status" onclick="alterarStatus('vida', 5)">+5 &raquo;</button>
                                    </div>
                                </div>
                                <div class="trilho-barra">
                                    <div class="preenchimento-barra barra-vida" id="barra-vida"></div>
                                </div>
                            </div>

                            <!-- BARRA DE ENERGIA -->
                            <div class="barra-status-container" id="container-energia">
                                <div class="barra-cabecalho">
                                    <span class="barra-titulo">Energia</span>
                                    <span class="barra-valores"><span id="valor-energia-atual">0</span> / <span id="valor-energia-max">0</span></span>
                                </div>
                                <div class="barra-controles">
                                    <div class="botoes-esquerda">
                                        <button class="btn-status" onclick="alterarStatus('energia', -5)">&laquo; -5</button>
                                        <button class="btn-status" onclick="alterarStatus('energia', -1)">&lt; -1</button>
                                    </div>
                                    <div class="botoes-direita">
                                        <button class="btn-status" onclick="alterarStatus('energia', 1)">+1 &gt;</button>
                                        <button class="btn-status" onclick="alterarStatus('energia', 5)">+5 &raquo;</button>
                                    </div>
                                </div>
                                <div class="trilho-barra">
                                    <div class="preenchimento-barra barra-energia" id="barra-energia"></div>
                                </div>
                            </div>

                            <!-- BARRA DE INTEGRIDADE -->
                            <div class="barra-status-container" id="container-integridade">
                                <div class="barra-cabecalho">
                                    <span class="barra-titulo">Integridade</span>
                                    <span class="barra-valores"><span id="valor-integridade-atual">0</span> / <span id="valor-integridade-max">0</span></span>
                                </div>
                                <div class="barra-controles">
                                    <div class="botoes-esquerda">
                                        <button class="btn-status" onclick="alterarStatus('integridade', -5)">&laquo; -5</button>
                                        <button class="btn-status" onclick="alterarStatus('integridade', -1)">&lt; -1</button>
                                    </div>
                                    <div class="botoes-direita">
                                        <button class="btn-status" onclick="alterarStatus('integridade', 1)">+1 &gt;</button>
                                        <button class="btn-status" onclick="alterarStatus('integridade', 5)">+5 &raquo;</button>
                                    </div>
                                </div>
                                <div class="trilho-barra">
                                    <div class="preenchimento-barra barra-integridade" id="barra-integridade"></div>
                                </div>
                            </div>
                   </div>
               </div>
            </aside>

    </main>
    <!-- Modal de Rolagem de Dados -->
<div id="modal-dado" class="modal-overlay hidden" onclick="fecharModal(event)">
    <div class="modal-conteudo">
        <span class="btn-fechar" onclick="fecharModalForcado()">&times;</span>
        <h3 id="modal-titulo">Rolagem</h3>
        <div class="modal-corpo">
            <div id="resultado-dado" class="dado-animado">d20</div>
            <div class="detalhes-rolagem">
                <span id="detalhe-calculo">1d20 + 0</span>
            </div>
            <div class="resultado-total">
                <span>Total: </span>
                <strong id="resultado-total-valor">0</strong>
            </div>
        </div>
    </div>
</div>
</body>
<script src="stts.js"></script>
<script src="read.js"></script>
</html>
